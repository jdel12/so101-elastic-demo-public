        image: ${REGISTRY}/so101-camera:v1
        imagePullPolicy: Always

        securityContext:
          privileged: true

        env:
        - name: ROS_DOMAIN_ID
          value: "0"
        - name: CAM1_DEVICE
          value: "usb1"
        - name: RMW_IMPLEMENTATION
          value: "rmw_fastrtps_cpp"
        - name: FASTRTPS_DEFAULT_PROFILES_FILE
          value: "/ros2_ws/fastdds_no_shm.xml"

        args: ["python3", "-u", "/ros2_ws/edge_camera_node.py", "--camera", "cam1"]

---
# --- Camera Node: Third Camera (GPU node) ---
# Publishes cam2 from GPU node. Must be on a third USB controller.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera-third
  namespace: robot
spec:
  replicas: 0
  selector:
    matchLabels:
      app: camera-third
  template:
    metadata:
      labels:
        app: camera-third
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        kubernetes.io/hostname: ${GPU_NODE_NAME}

      containers:
      - name: camera
        image: ${REGISTRY}/so101-camera:v1
        imagePullPolicy: Always

        securityContext:
          privileged: true

        env:
        - name: ROS_DOMAIN_ID
          value: "0"
        - name: CAM2_DEVICE
          value: "usb3"
        - name: RMW_IMPLEMENTATION
          value: "rmw_fastrtps_cpp"
        - name: FASTRTPS_DEFAULT_PROFILES_FILE
          value: "/ros2_ws/fastdds_no_shm.xml"

        args: ["python3", "-u", "/ros2_ws/edge_camera_node.py", "--camera", "cam2"]
